<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kumamoto Investment Opportunities</title>

    <!-- Google Fonts: REM + Noto Sans JP + Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Rem:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- App CSS -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/embed-mobile.css" />
  </head>
  <body>
    <!-- Embed-mode behavior (data-embed / data-embed-host / data-chromeless
         attributes, iPhone bottom sheet, valueadd postMessage contract, setup
         cover, click intercepts) now lives in `js/map-core/` and is applied
         by `mountMap` based on the resolved `embedHost` option. URL fallbacks
         (`?embed=1`, `?host=valueadd`, `?chromeless=1`) preserved by
         `js/map-core/options.js`. See docs/architecture-and-sync-workflow.md
         and docs/plans/map-core-extraction-execution-plan.md. -->

    <style>
      /* Dev tools are always hidden in any embed mode. */
      [data-embed="1"] #camera-debug-toggle,
      [data-embed="1"] #camera-debug,
      [data-embed="1"] #qa-toggle,
      [data-embed="1"] #qa-panel,
      [data-embed="1"] #camera-explorer-toggle,
      [data-embed="1"] #camera-explorer,
      [data-embed="1"] #step-jumper-toggle,
      [data-embed="1"] #step-jumper,
      [data-embed="1"] #layers-toggle {
        display: none !important;
      }

      /* The iPhone playground embed hides the language toggle, panel
         toggle, time toggle, and journey progress. The value-add
         host wants them visible, so this rule is scoped to NOT match
         when host=valueadd. */
      [data-embed="1"]:not([data-embed-host="valueadd"]) #lang-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #panel-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #time-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #journey-progress {
        display: none !important;
      }

      /* Dev-only QA tool toggle. Cmd+Shift+1 flips data-dev-hidden on <html>
         so the local presenter can clear the screen without leaving the
         browser. Handler is gated by import.meta.env.DEV in main.js, so this
         attribute is only ever set in development. */
      [data-dev-hidden="1"] #camera-debug-toggle,
      [data-dev-hidden="1"] #camera-debug,
      [data-dev-hidden="1"] #qa-toggle,
      [data-dev-hidden="1"] #qa-panel,
      [data-dev-hidden="1"] #camera-explorer-toggle,
      [data-dev-hidden="1"] #camera-explorer,
      [data-dev-hidden="1"] #step-jumper-toggle,
      [data-dev-hidden="1"] #step-jumper {
        display: none !important;
      }

      /* ───── Embed mode: iPhone 17 Pro frame ─────
         Matches the JSX PhoneFrame used by the other playground
         prototypes. The iframe viewport is 440 x 900 (playground
         constant). We paint the neutral page on <html>, center a
         380 x 732 bezel on <body>, and the app fills the 368 x 720
         screen inside. The `transform` on body makes body the
         containing block for descendants with `position: fixed`,
         so the right panel, gallery, and overlays stay inside the
         phone screen instead of escaping to the iframe viewport. */
      [data-embed="1"] {
        background: #EDEEF1;
      }
      html[data-embed="1"] {
        min-height: 100%;
      }
      [data-embed="1"] body {
        width: 380px;
        height: 732px;
        padding: 6px;
        margin: 0 auto;
        box-sizing: border-box;
        background: #1A1A1E;
        border-radius: 44px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        overflow: hidden;
        position: relative;
        transform: translate(0, 0);
      }
      [data-embed="1"] #app-container {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        height: 100%;
        border-radius: 40px;
        overflow: hidden;
        background: #F9F9F9;
      }
      [data-embed="1"] #map-container {
        border-radius: 40px;
        overflow: hidden;
      }

      /* Full-screen modal overlays stay inside the phone screen. The
         bottom sheet (#right-panel) and the nav arrows are styled in
         embed-mobile.css. */
      [data-embed="1"] #gallery-modal,
      [data-embed="1"] #property-quick-look,
      [data-embed="1"] #evidence-preview {
        position: absolute;
        inset: 0;
        width: auto;
        height: auto;
        border-radius: 40px;
        overflow: hidden;
      }

      /* ───── value-add-prototype embed host overrides ─────
         Activated by ?embed=1&host=valueadd. Overrides the iPhone phone
         frame above and lets the iframe fill its container — the slideshow
         draws its own iPad frame around the iframe. */
      [data-embed-host="valueadd"] {
        background: #F9F9F9;
      }
      html[data-embed-host="valueadd"],
      [data-embed-host="valueadd"] body {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
      }
      [data-embed-host="valueadd"] body {
        background: #F9F9F9;
        border-radius: 0;
        box-shadow: none;
        position: relative;
        transform: translate(0, 0);
      }
      [data-embed-host="valueadd"] #app-container {
        border-radius: 0;
      }
      [data-embed-host="valueadd"] #map-container {
        border-radius: 0;
      }
      [data-embed-host="valueadd"] #gallery-modal,
      [data-embed-host="valueadd"] #property-quick-look,
      [data-embed-host="valueadd"] #evidence-preview {
        border-radius: 0;
      }

      /* Chromeless mode (toggled via ?chromeless=1 or postMessage). Hides
         every interactive overlay so the map reads as a pure visual
         surface during transitions. */
      [data-chromeless="1"] #right-panel,
      [data-chromeless="1"] #nav-arrows,
      [data-chromeless="1"] #view-mode-toggle,
      [data-chromeless="1"] #lang-toggle {
        display: none !important;
      }
    </style>

    <!-- Skip Link for keyboard users -->
    <a href="#map-container" class="skip-link">Skip to main content</a>

    <!-- Start screen removed - map loads directly -->
    <div id="start-screen" style="display: none"></div>

    <!-- Main App Container -->
    <div id="app-container">
      <!-- Map Container -->
      <div id="map-container" tabindex="-1">
        <div
          id="map"
          role="application"
          aria-label="熊本投資區域互動地圖"
        ></div>
        <!-- Screen reader announcements for map interactions -->
        <div
          id="map-announcements"
          class="sr-only"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <!-- Journey Progress Bar (populated dynamically by UI.updateJourneyProgress) -->
        <nav
          id="journey-progress"
          class="hidden"
          role="progressbar"
          aria-valuemin="1"
          aria-label="旅程進度"
        ></nav>

        <!-- Time Toggle -->
        <div
          id="time-toggle"
          class="hidden"
          role="radiogroup"
          aria-label="地圖時間檢視"
        >
          <button
            id="present-btn"
            class="time-btn active"
            role="radio"
            aria-checked="true"
          >
            Now
          </button>
          <button
            id="future-btn"
            class="time-btn"
            role="radio"
            aria-checked="false"
          >
            Future
          </button>
        </div>

        <!-- Nav arrows (replaces chatbox + FAB) -->
        <div class="nav-arrows" id="nav-arrows" style="display: none;">
          <button class="nav-btn back" id="nav-back" aria-label="Previous step">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <button class="nav-btn forward" id="nav-forward" aria-label="Next step">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- DEV-ONLY-START -->
        <!-- Layers Toggle Button (hidden until journey starts) -->
        <button
          id="layers-toggle"
          class="hidden"
          aria-label="切換地圖圖層"
          aria-expanded="false"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </button>


        <!-- Data Layers Panel (journey-aware, toggled by button) -->
        <div
          id="data-layers"
          class="hidden"
          role="region"
          aria-label="資料圖層"
        >
          <div class="layers-title">資料圖層</div>
          <div class="layer-items" id="data-layer-items">
            <!-- Populated by JS - includes both map layers and data layers -->
          </div>
        </div>
        <!-- DEV-ONLY-END -->

        <!-- DEV-ONLY-START -->
        <!-- Camera Debug Tool (dev only, top-left) -->
        <button
          id="camera-debug-toggle"
          aria-label="Toggle camera debug"
          title="Camera debug"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </button>
        <div id="camera-debug" class="hidden">
          <div class="camera-debug-header">
            <span class="camera-debug-title">Camera</span>
            <button
              id="camera-debug-copy"
              aria-label="Copy camera values"
              title="Copy to clipboard"
            >
              <svg
                aria-hidden="true"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
            </button>
          </div>
          <div class="camera-debug-grid">
            <div class="camera-debug-row">
              <span class="camera-debug-label">lat</span>
              <span class="camera-debug-value" id="cam-lat">--</span>
            </div>
            <div class="camera-debug-row">
              <span class="camera-debug-label">lng</span>
              <span class="camera-debug-value" id="cam-lng">--</span>
            </div>
            <div class="camera-debug-row">
              <span class="camera-debug-label">zoom</span>
              <span class="camera-debug-value" id="cam-zoom">--</span>
            </div>
            <div class="camera-debug-row">
              <span class="camera-debug-label">pitch</span>
              <span class="camera-debug-value" id="cam-pitch">--</span>
            </div>
            <div class="camera-debug-row">
              <span class="camera-debug-label">bearing</span>
              <span class="camera-debug-value" id="cam-bearing">--</span>
            </div>
          </div>
        </div>
        <!-- DEV-ONLY-END -->

        <!-- DEV-ONLY-START -->
        <!-- QA Reporter (dev tool, top-left below camera debug) -->
        <button
          id="qa-toggle"
          aria-label="Toggle QA reporter"
          title="QA reporter"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            />
            <path d="m9 14 2 2 4-4" />
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
          </svg>
        </button>
        <div id="qa-panel" class="hidden">
          <div class="qa-header">
            <span class="qa-title">QA reporter</span>
            <span class="qa-count" id="qa-count">0</span>
            <button
              id="qa-copy"
              class="qa-header-btn"
              aria-label="Copy all unsolved issues"
              title="Copy unsolved issues"
            >
              <svg
                aria-hidden="true"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
            </button>
          </div>
          <div class="qa-step-indicator" id="qa-step-indicator">Step: --</div>
          <div class="qa-form">
            <div class="qa-categories" id="qa-categories">
              <!-- Populated by JS -->
            </div>
            <textarea
              id="qa-description"
              class="qa-textarea"
              placeholder="Describe the issue..."
              rows="3"
            ></textarea>
            <button id="qa-add" class="qa-add-btn" disabled>Add issue</button>
          </div>
          <div class="qa-divider"></div>
          <div class="qa-issues" id="qa-issues">
            <!-- Populated by JS -->
          </div>
        </div>
        <!-- DEV-ONLY-END -->

        <!-- DEV-ONLY-START -->
        <!-- Camera Explorer (dev only) -->
        <button
          id="camera-explorer-toggle"
          aria-label="Toggle camera explorer"
          title="Camera explorer"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"
            />
            <circle cx="12" cy="13" r="3" />
          </svg>
        </button>
        <div id="camera-explorer" class="hidden">
          <div class="camera-explorer-header">
            <span class="camera-explorer-title">Camera explorer</span>
            <button class="camera-explorer-view-toggle">Switch to 3D</button>
          </div>
          <div class="camera-explorer-fields">
            <div class="camera-explorer-row">
              <span class="camera-explorer-label">lng, lat</span>
              <span class="camera-explorer-value" data-field="lnglat">--</span>
            </div>
            <div class="camera-explorer-row">
              <span class="camera-explorer-label">lat, lng</span>
              <span class="camera-explorer-value" data-field="latlng">--</span>
            </div>
            <div class="camera-explorer-row">
              <span class="camera-explorer-label">zoom</span>
              <span class="camera-explorer-value" data-field="zoom">--</span>
            </div>
            <div class="camera-explorer-row">
              <span class="camera-explorer-label">pitch</span>
              <span class="camera-explorer-value" data-field="pitch">--</span>
            </div>
            <div class="camera-explorer-row">
              <span class="camera-explorer-label">bearing</span>
              <span class="camera-explorer-value" data-field="bearing">--</span>
            </div>
          </div>
          <div class="camera-explorer-divider"></div>
          <div class="camera-explorer-toggles">
            <button class="camera-explorer-layer-toggle" data-layer="buildings">
              3D buildings
            </button>
            <button class="camera-explorer-layer-toggle" data-layer="labels">
              Labels
            </button>
            <button class="camera-explorer-layer-toggle" data-layer="terrain">
              Terrain
            </button>
          </div>
          <div class="camera-explorer-divider"></div>
          <div class="camera-explorer-sliders">
            <div class="camera-explorer-slider-row">
              <label class="camera-explorer-slider-label">zoom</label>
              <input
                type="range"
                class="camera-explorer-range"
                data-control="zoom"
                min="1"
                max="22"
                step="0.1"
              />
              <span
                class="camera-explorer-slider-value"
                data-control-value="zoom"
                >--</span
              >
            </div>
            <div class="camera-explorer-slider-row">
              <label class="camera-explorer-slider-label">pitch</label>
              <input
                type="range"
                class="camera-explorer-range"
                data-control="pitch"
                min="0"
                max="85"
                step="1"
              />
              <span
                class="camera-explorer-slider-value"
                data-control-value="pitch"
                >--</span
              >
            </div>
            <div class="camera-explorer-slider-row">
              <label class="camera-explorer-slider-label">bearing</label>
              <input
                type="range"
                class="camera-explorer-range"
                data-control="bearing"
                min="-180"
                max="180"
                step="1"
              />
              <span
                class="camera-explorer-slider-value"
                data-control-value="bearing"
                >--</span
              >
            </div>
            <div class="camera-explorer-slider-row">
              <label class="camera-explorer-slider-label">terrain</label>
              <input
                type="range"
                class="camera-explorer-range"
                data-control="exaggeration"
                min="0.5"
                max="5"
                step="0.1"
                value="1.5"
              />
              <span
                class="camera-explorer-slider-value"
                data-control-value="exaggeration"
                >1.5</span
              >
            </div>
          </div>
          <div class="camera-explorer-divider"></div>
          <pre class="camera-explorer-config">{ ... }</pre>
          <button class="camera-explorer-copy">Copy config</button>
        </div>
        <!-- DEV-ONLY-END -->

        <!-- DEV-ONLY-START -->
        <!-- Step Jumper (dev only, bottom-left) -->
        <button
          id="step-jumper-toggle"
          aria-label="Toggle step jumper"
          title="Step jumper"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="8" x2="21" y1="6" y2="6" />
            <line x1="8" x2="21" y1="12" y2="12" />
            <line x1="8" x2="21" y1="18" y2="18" />
            <line x1="3" x2="3.01" y1="6" y2="6" />
            <line x1="3" x2="3.01" y1="12" y2="12" />
            <line x1="3" x2="3.01" y1="18" y2="18" />
          </svg>
        </button>
        <div id="step-jumper" class="hidden">
          <div class="step-jumper-header">
            <span class="step-jumper-title">Step jumper</span>
          </div>
          <div class="step-jumper-list">
            <!-- Populated by JS -->
          </div>
        </div>
        <!-- DEV-ONLY-END -->

        <!-- Dashboard Toggle Button (right side) -->
        <button
          id="panel-toggle"
          class="hidden"
          aria-label="切換儀表板"
          aria-expanded="false"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M15 3v18" />
          </svg>
        </button>

        <!-- Dashboard Toggle Button - removed in v2 overhaul -->
      </div>

      <!-- Dashboard -->
      <aside
        id="right-panel"
        class="hidden"
        role="complementary"
        aria-label="儀表板"
      >
        <div class="panel-toolbar">
          <button id="panel-home" class="hidden" aria-label="回到儀表板首頁">
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
          <button id="panel-close" aria-label="關閉儀表板">
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="panel-content"></div>
      </aside>
    </div>

    <!-- Gallery Modal -->
    <div
      id="gallery-modal"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gallery-title"
    >
      <div id="gallery-overlay"></div>
      <div id="gallery-content">
        <button id="gallery-close" aria-label="關閉圖庫">
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <h2 id="gallery-title" class="sr-only">文件檢視器</h2>
        <div id="gallery-body"></div>
      </div>
    </div>

    <!-- Property Image Quick Look Modal (macOS pattern) -->
    <div
      id="property-quick-look"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-label="物件圖片放大檢視"
    >
      <div
        id="quick-look-overlay"
        onclick="UI.hidePropertyImageQuickLook()"
      ></div>
      <div id="quick-look-content">
        <button
          id="quick-look-close"
          aria-label="關閉圖片"
          onclick="UI.hidePropertyImageQuickLook()"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <img id="quick-look-image" src="" alt="" />
      </div>
    </div>

    <!-- Evidence Preview Overlay -->
    <div
      id="evidence-preview"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-label="佐證資料預覽"
    >
      <div
        id="evidence-preview-overlay"
        onclick="UI.hideEvidencePreview()"
      ></div>
      <div id="evidence-preview-content">
        <button
          id="evidence-preview-close"
          aria-label="關閉預覽"
          onclick="UI.hideEvidencePreview()"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <div id="evidence-preview-body"></div>
      </div>
    </div>


    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Mapbox GL JS. Token resolution (parent-window injection, URL param,
         bundled fallback) now lives in `js/map-core/options.js` and is
         applied by `mountMap` via `window.MAPBOX_ACCESS_TOKEN` before
         `MapController.init()` runs. -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Language toggle (top-right) -->
    <button id="lang-toggle" aria-label="切換語言">EN</button>
    <script>
      (function () {
        const btn = document.getElementById("lang-toggle");
        // Optional ?lang= query-param overrides localStorage. Used by embeds
        // that need a deterministic language regardless of prior visits.
        const urlLang = new URLSearchParams(location.search).get("lang");
        if (urlLang === "en" || urlLang === "zh-TW") {
          localStorage.setItem("app-lang", urlLang);
        }
        const current = localStorage.getItem("app-lang") || "en";
        document.documentElement.lang = current;
        btn.textContent = current === "zh-TW" ? "EN" : "中文";
        btn.addEventListener("click", function () {
          const next = current === "zh-TW" ? "en" : "zh-TW";
          localStorage.setItem("app-lang", next);
          location.reload();
        });
      })();
    </script>

    <!-- Rotate-to-landscape overlay (touch devices in portrait).
         The app is designed for landscape; this overlay covers the
         broken portrait layout until the user rotates the iPad. -->
    <div id="rotate-overlay" aria-hidden="true">
      <div class="rotate-overlay-inner">
        <svg
          class="rotate-overlay-icon"
          width="96"
          height="96"
          viewBox="0 0 96 96"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="30"
            y="10"
            width="36"
            height="54"
            rx="5"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
          />
          <circle cx="48" cy="58" r="1.6" fill="currentColor" />
          <path
            d="M16 66 Q16 84 34 84 L62 84 Q80 84 80 66"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M74 70 L80 64 L86 70"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <h2 class="rotate-overlay-title">Rotate to Landscape</h2>
        <p class="rotate-overlay-body">
          This experience is designed for landscape orientation.
        </p>
      </div>
    </div>

    <!-- App JS (ES modules) -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
