<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — iPad Dashboard Variants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rem:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <style>
      :root {
        --stage-w: 1366px;
        --stage-h: 1024px;
        /* Soft map placeholder tone; only used until Mapbox tiles paint. */
        --map-tone: #e6ebde;

        /* Tier aliases — map straight to the project's existing system
           colors. Match the real app's governmentTiers data values. */
        --color-tier-central: var(--color-info);
        --color-tier-prefecture: var(--color-success);
        --color-tier-local: var(--color-warning);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-bg-tertiary);
        font-family: var(--font-display);
        color: var(--color-text-primary);
        height: 100vh;
        overflow: hidden;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toolbar {
        position: fixed;
        top: var(--space-4);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: inline-flex;
        gap: var(--space-1);
        padding: var(--space-1);
        background: var(--color-bg-primary);
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-large);
        align-items: center;
      }

      .toolbar-label {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-tertiary);
        padding: 0 var(--space-3) 0 var(--space-4);
        letter-spacing: var(--tracking-small);
      }

      .chip {
        appearance: none;
        border: none;
        background: transparent;
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-secondary);
        min-height: var(--touch-target-min);
        padding: 0 var(--space-5);
        border-radius: var(--radius-full);
        cursor: pointer;
        transition:
          background var(--duration-normal) var(--easing-decelerate),
          color var(--duration-normal) var(--easing-decelerate);
        white-space: nowrap;
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .chip:hover {
          background: var(--color-bg-secondary);
          color: var(--color-text-primary);
        }
      }

      .chip[aria-pressed="true"] {
        background: var(--color-text-primary);
        color: var(--color-bg-primary);
      }

      .chip:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: 2px;
      }

      .stage-wrapper {
        position: relative;
        --scale: 1;
        width: calc(1366px * var(--scale));
        height: calc(1024px * var(--scale));
      }

      .stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1366px;
        height: 1024px;
        background-color: var(--map-tone);
        border-radius: var(--radius-xlarge);
        overflow: hidden;
        box-shadow: var(--shadow-xlarge);
        transform-origin: top left;
        transform: scale(var(--scale));
      }

      .map {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .map .mapboxgl-ctrl-bottom-left,
      .map .mapboxgl-ctrl-bottom-right,
      .map .mapboxgl-ctrl-top-left,
      .map .mapboxgl-ctrl-top-right {
        display: none;
      }

      /* ============================
         MAP MARKERS — custom HTML markers placed via mapboxgl.Marker.
         ============================ */
      .map-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
      }

      .map-marker-logo-inner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--shadow-medium);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--color-primary);
        overflow: hidden;
      }

      .map-marker-logo-inner img {
        width: 72%;
        height: 72%;
        object-fit: contain;
      }

      .map-marker-pin {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--color-tier-central);
        box-shadow:
          0 0 0 4px rgba(255, 255, 255, 0.85),
          var(--shadow-medium);
      }

      .map-marker-property {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--color-primary);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-medium);
        border: 2px solid #fff;
      }

      .map-marker-property svg {
        width: 20px;
        height: 20px;
        stroke-width: 2;
      }

      .map-marker-airport {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--color-tier-central);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-medium);
        border: 2px solid #fff;
      }

      .map-marker-airport svg {
        width: 20px;
        height: 20px;
      }

      .map-marker-label {
        background: rgba(30, 31, 32, 0.88);
        color: #fff;
        font-family: var(--font-display);
        font-size: 11px;
        font-weight: var(--font-weight-semibold);
        padding: 3px 8px;
        border-radius: var(--radius-full);
        white-space: nowrap;
        letter-spacing: var(--tracking-small);
      }

      /* ============================
         NAV ARROWS — centered on visible (non-panel) map area.
         56pt circular targets (above the 44pt iPad HIG minimum).
         ============================ */
      .nav-cluster {
        position: absolute;
        bottom: var(--space-10);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: var(--space-4);
        align-items: center;
        z-index: 5;
      }

      .step-indicator {
        position: fixed;
        bottom: var(--space-4);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-5);
        background: var(--color-bg-primary);
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-large);
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .step-indicator-sub {
        color: var(--color-text-tertiary);
        font-weight: var(--font-weight-medium);
      }

      .nav-btn {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-full);
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-primary);
        box-shadow: var(--shadow-medium);
        cursor: pointer;
        transition:
          transform var(--duration-normal) var(--easing-decelerate),
          background var(--duration-normal) var(--easing-decelerate);
      }

      .nav-btn.primary {
        background: var(--color-primary);
        color: var(--color-text-on-primary);
        border-color: var(--color-primary);
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .nav-btn:hover {
          transform: scale(1.04);
        }
      }

      /* Neutralize the unscoped .nav-btn:hover rule inherited from
         ../css/styles.css when the viewport is iPad-size. Covers real iPad
         and Safari Responsive Design Mode emulation (which reports
         hover: hover, pointer: fine, so the @media (hover: none)
         neutralizer in styles.css doesn't fire). */
      @media (max-width: 1440px) {
        .nav-btn:hover {
          transform: none;
          box-shadow: var(--shadow-medium);
        }
      }

      .nav-btn:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: 2px;
      }

      .nav-btn svg {
        width: var(--icon-lg);
        height: var(--icon-lg);
        stroke-width: 2;
      }

      .nav-btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ============================
         PANEL BASE
         All type sized at or above the iPad practical floor (14pt body,
         11pt absolute). All interactive targets >= 44pt.
         ============================ */
      .panel {
        position: absolute;
        top: var(--space-6);
        right: var(--space-6);
        bottom: var(--space-6);
        background: var(--color-bg-primary);
        border-radius: var(--radius-xlarge);
        box-shadow: var(--shadow-large);
        display: flex;
        overflow: hidden;
        font-family: var(--font-display);
        color: var(--color-text-primary);
      }

      .panel-close {
        position: absolute;
        top: var(--space-3);
        right: var(--space-3);
        width: var(--touch-target-min);
        height: var(--touch-target-min);
        border: none;
        background: var(--color-bg-secondary);
        border-radius: var(--radius-full);
        color: var(--color-text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background var(--duration-normal) var(--easing-decelerate);
        z-index: 2;
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .panel-close:hover {
          background: var(--color-bg-tertiary);
          color: var(--color-text-primary);
        }
      }

      .panel-close:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: 2px;
      }

      .panel-close svg {
        width: var(--icon-md);
        height: var(--icon-md);
        stroke-width: 2;
      }

      .breadcrumb {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-tertiary);
        letter-spacing: var(--tracking-small);
      }

      .panel-title {
        font-family: var(--font-display);
        font-weight: var(--font-weight-bold);
        font-size: var(--text-2xl);
        line-height: var(--line-height-tight);
        letter-spacing: var(--tracking-display);
        margin: 0;
        color: var(--color-text-primary);
      }

      .panel-subtitle {
        font-family: var(--font-body);
        font-size: var(--text-sm);
        color: var(--color-text-secondary);
        line-height: var(--line-height-normal);
        margin: 0;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-4) var(--space-6);
      }

      .stat-grid .stat-row {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .stat-label {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-tertiary);
        letter-spacing: var(--tracking-small);
      }

      .stat-value {
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        line-height: var(--line-height-tight);
      }

      .section-label {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-secondary);
        letter-spacing: var(--tracking-small);
        margin: 0;
      }

      .cta {
        appearance: none;
        border: none;
        background: var(--color-primary);
        color: var(--color-text-on-primary);
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
        height: 52px;
        padding: 0 var(--space-6);
        border-radius: var(--radius-large);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition:
          background var(--duration-normal) var(--easing-decelerate),
          box-shadow var(--duration-normal) var(--easing-decelerate);
        box-shadow: var(--shadow-medium);
      }

      .cta:active {
        background: var(--color-primary-pressed);
      }

      .cta:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .cta:hover {
          background: var(--color-primary-hover);
          box-shadow: var(--shadow-large);
        }
      }

      /* Secondary CTA — bordered, mirrors .panel-btn.secondary in the
         real app. Used for "View evidence". */
      .cta.secondary {
        background: transparent;
        border: 1px solid var(--color-border-strong);
        color: var(--color-text-primary);
        box-shadow: none;
      }

      .cta.secondary:active {
        background: var(--color-bg-tertiary);
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .cta.secondary:hover {
          background: var(--color-bg-secondary);
          box-shadow: none;
        }
      }

      /* ============================
         STEP CONTENT BLOCKS — used inside variant body panes.
         ============================ */
      .step-section {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .step-prose {
        font-family: var(--font-body);
        font-size: var(--text-sm);
        line-height: var(--line-height-normal);
        color: var(--color-text-secondary);
        margin: 0;
      }

      .step-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .step-list-item {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-3);
        background: var(--color-bg-secondary);
        border-radius: var(--radius-medium);
      }

      .step-list-icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: var(--radius-medium);
        background: var(--color-bg-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-secondary);
      }

      .step-list-icon svg {
        width: var(--icon-sm);
        height: var(--icon-sm);
        stroke-width: 1.75;
      }

      .step-list-icon img {
        width: 80%;
        height: 80%;
        object-fit: contain;
      }

      .step-image {
        width: 100%;
        border-radius: var(--radius-medium);
        overflow: hidden;
        background: var(--color-bg-secondary);
      }

      .step-image img {
        width: 100%;
        height: auto;
        display: block;
      }

      .step-image-gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
      }

      .step-image-gallery img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: var(--radius-small);
        display: block;
        background: var(--color-bg-secondary);
      }

      .step-list-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .step-list-title {
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        line-height: var(--line-height-tight);
      }

      .step-list-sub {
        font-family: var(--font-body);
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        line-height: var(--line-height-normal);
      }

      .step-list-value {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        white-space: nowrap;
        flex-shrink: 0;
        align-self: center;
        font-variant-numeric: tabular-nums;
      }

      .evidence-block {
        display: flex;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        background: var(--color-bg-secondary);
        border-radius: var(--radius-medium);
        align-items: flex-start;
      }

      .evidence-block-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-medium);
        background: var(--color-bg-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color-info);
        flex-shrink: 0;
      }

      .evidence-block-icon svg {
        width: var(--icon-sm);
        height: var(--icon-sm);
        stroke-width: 1.75;
      }

      .evidence-block-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .evidence-block-title {
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        line-height: var(--line-height-tight);
      }

      .evidence-block-desc {
        font-family: var(--font-body);
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        line-height: var(--line-height-normal);
      }

      /* ============================
         VARIANT A — Compact tabs (420 pt panel)
         ============================ */
      .panel-a {
        width: 540px;
        flex-direction: column;
      }

      .panel-a-header {
        padding: var(--space-8) var(--space-6) var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .panel-a-tabs {
        display: flex;
        gap: var(--space-1);
        background: var(--color-bg-secondary);
        border-radius: var(--radius-medium);
        margin: 0 var(--space-6) var(--space-4);
        padding: var(--space-1);
      }

      .panel-a-tab {
        flex: 1;
        min-width: 0;
        appearance: none;
        border: none;
        background: transparent;
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-secondary);
        min-height: 40px;
        padding: 0 var(--space-2);
        border-radius: var(--radius-small);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--duration-normal) var(--easing-decelerate),
          color var(--duration-normal) var(--easing-decelerate);
      }

      .panel-a-tab[aria-selected="true"] {
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
        font-weight: var(--font-weight-semibold);
        box-shadow: var(--shadow-subtle);
      }

      .panel-a-tab:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: -2px;
      }

      .panel-a-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 var(--space-6) var(--space-4);
      }

      .panel-a-footer {
        padding: var(--space-4) var(--space-6) var(--space-6);
        border-top: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .panel-a-footer:empty,
      .panel-c-footer:empty {
        display: none;
      }

      .panel-a .commute-pill {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        padding: var(--space-2) var(--space-3);
        background: var(--color-bg-secondary);
        color: var(--color-text-secondary);
        border-radius: var(--radius-full);
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-medium);
        white-space: nowrap;
      }
      /* ============================
         VARIANT C — Disclosure stack (380 pt panel)
         ============================ */
      .panel-c {
        width: 540px;
        flex-direction: column;
      }

      .panel-c-header {
        padding: var(--space-8) var(--space-6) var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .panel-c-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 var(--space-2) var(--space-4);
      }

      .disclosure {
        border-bottom: 1px solid var(--color-border);
      }

      .disclosure-summary {
        list-style: none;
        appearance: none;
        cursor: pointer;
        padding: var(--space-3) var(--space-4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        min-height: var(--touch-target-min);
        border-radius: var(--radius-medium);
        transition: background var(--duration-normal) var(--easing-decelerate);
      }

      @media (hover: hover) and (pointer: fine) and (min-width: 1441px) {
        .disclosure-summary:hover {
          background: var(--color-bg-secondary);
        }
      }

      .disclosure-summary:focus-visible {
        outline: 2px solid var(--color-info);
        outline-offset: -2px;
      }

      .disclosure-summary::-webkit-details-marker {
        display: none;
      }

      .disclosure-summary::marker {
        display: none;
      }

      .disclosure-chevron {
        width: var(--icon-sm);
        height: var(--icon-sm);
        color: var(--color-text-tertiary);
        transition:
          transform var(--duration-normal) var(--easing-decelerate),
          color var(--duration-normal) var(--easing-decelerate);
        stroke-width: 2.25;
      }

      .disclosure[open] .disclosure-chevron {
        transform: rotate(90deg);
        color: var(--color-primary);
      }

      /* Soft amber tint — matches the project's existing convention
         (rgba of --color-primary #fbb931, used in 5+ places in styles.css). */
      .disclosure[open] > .disclosure-summary {
        background: rgba(251, 185, 49, 0.12);
      }

      .disclosure-content {

        position: absolute;
        left: var(--space-8);
        top: var(--space-8);
        background: var(--color-text-primary);
        color: var(--color-bg-primary);
        padding: var(--space-2) var(--space-3);

        margin-bottom: var(--space-1);
        display: flex;
        align-items: center;
        gap: var(--space-2);

        font-weight: var(--font-weight-semibold);
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
        padding: 0 var(--space-2);
        border-radius: var(--radius-small);
        font-size: var(--text-xs);

      .variant-content {
        display: none;
      }

        display: contents;
      }

      .panel.is-closed {
        transform: translateX(calc(100% + var(--space-16)));
        opacity: 0;
        pointer-events: none;
      }

        transition:
          transform var(--duration-slow) var(--easing-decelerate),

        justify-content: center;

        width: var(--icon-md);
        height: var(--icon-md);
        stroke-width: 2;
      }

        display: none;
      }

        flex-direction: column;
        gap: var(--space-5);

      // ============================
      // Block renderer (shared)
      // ============================
      function renderBlock(block) {
        if (block.type === "prose") {
          return `<p class="step-prose">${block.text}</p>`;
        }
        if (block.type === "statGrid") {
          const rows = block.items
            .map(
              (it) => `
              <div class="stat-row${it.hero ? " hero" : ""}">
                <div class="stat-label">${it.label}</div>
                <div class="stat-value">${it.value}</div>
              </div>`
            )
            .join("");
          const tierClass = block.tier ? ` tier-${block.tier}` : "";
          return `
            <div class="step-section">
              ${block.label ? `<p class="section-label${tierClass}">${block.label}</p>` : ""}
              <div class="stat-grid">${rows}</div>
            </div>`;
        }
        if (block.type === "list") {
          const items = block.items
            .map(
              (it) => `
              <li class="step-list-item">
                <span class="step-list-icon">${icon(it.icon)}</span>
                <div class="step-list-body">
                  <div class="step-list-title">${it.title}</div>
                  ${it.sub ? `<div class="step-list-sub">${it.sub}</div>` : ""}
                </div>
                ${it.value ? `<span class="step-list-value">${it.value}</span>` : ""}
              </li>`
            )
            .join("");
          return `
            <div class="step-section">
              ${block.label ? `<p class="section-label">${block.label}</p>` : ""}
              <ul class="step-list">${items}</ul>
            </div>`;
        }
        if (block.type === "evidence") {
          return `
            <div class="evidence-block">
              <span class="evidence-block-icon">${icon("file-text")}</span>
              <div class="evidence-block-body">
                <div class="evidence-block-title">${block.title}</div>
                <div class="evidence-block-desc">${block.description}</div>
              </div>
            </div>`;
        }
        if (block.type === "logoList") {
          const items = block.items
            .map(
              (it) => `
              <li class="step-list-item">
                <span class="step-list-icon">${it.logo ? `<img src="${it.logo}" alt="${it.title}" />` : icon(it.icon || "building")}</span>
                <div class="step-list-body">
                  <div class="step-list-title">${it.title}</div>
                  ${it.sub ? `<div class="step-list-sub">${it.sub}</div>` : ""}
                </div>
                ${it.value ? `<span class="step-list-value">${it.value}</span>` : ""}
              </li>`
            )
            .join("");
          return `
            <div class="step-section">
              ${block.label ? `<p class="section-label">${block.label}</p>` : ""}
              <ul class="step-list">${items}</ul>
            </div>`;
        }
        if (block.type === "image") {
          return `
            <div class="step-section">
              ${block.label ? `<p class="section-label">${block.label}</p>` : ""}
              <div class="step-image"><img src="${block.src}" alt="${block.alt || ""}" /></div>
            </div>`;
        }
        if (block.type === "imageGallery") {
          const imgs = block.images
            .map((src) => `<img src="${src}" alt="" loading="lazy" />`)
            .join("");
          return `
            <div class="step-section">
              ${block.label ? `<p class="section-label">${block.label}</p>` : ""}
              <div class="step-image-gallery">${imgs}</div>
            </div>`;
        }
        return "";
      }

      function renderBlocks(blocks) {
        return blocks.map(renderBlock).join("");
      }

      function blocksHaveEvidence(blocks) {
        return Array.isArray(blocks) && blocks.some((b) => b.type === "evidence");
      }

      // Per-tab/per-section: only show the View evidence button if the
      // active tab (Variant A) or open section (Variant C) actually has
      // an evidence block in its data.
      function renderFooterCta(blocks) {
        return blocksHaveEvidence(blocks)
          ? `<button class="cta secondary" style="width: 100%;">View evidence</button>`
          : "";
      }

      // ============================
      // Variant A — tabs
      // ============================
      function renderVariantA(panel, step) {
        const header = panel.querySelector('[data-slot="header"]');
        const tabsHost = panel.querySelector('[data-slot="tabs"]');
        const body = panel.querySelector('[data-slot="body"]');
        const footer = panel.querySelector('[data-slot="footer"]');

        header.innerHTML = `
          <div class="breadcrumb">${step.breadcrumb}</div>
          <h1 class="panel-title">${step.title}</h1>
        `;

        tabsHost.innerHTML = step.tabs
          .map(
            (t, i) => `
            <button class="panel-a-tab" role="tab" aria-selected="${i === 0 ? "true" : "false"}" data-pane-target="${t.id}">
              ${t.label}
            </button>`
          )
          .join("");

        body.innerHTML = step.tabs
          .map(
            (t, i) => `
            <div data-pane="${t.id}" class="${i === 0 ? "is-active" : ""}">
              ${renderBlocks(t.blocks)}
            </div>`
          )
          .join("");

        footer.innerHTML = renderFooterCta(step.tabs[0]?.blocks);

        activePane.a = step.tabs[0]?.id;
        wireTabGroup(panel, ".panel-a-tabs", ".panel-a-tab", "a", step.tabs);
      }

      // ============================
      // Variant C — disclosure stack (tabs + extras)
      // ============================
      function renderVariantC(panel, step) {
        const header = panel.querySelector('[data-slot="header"]');
        const body = panel.querySelector('[data-slot="body"]');
        const footer = panel.querySelector('[data-slot="footer"]');

        header.innerHTML = `
          <div class="breadcrumb">${step.breadcrumb}</div>
          <h1 class="panel-title">${step.title}</h1>
          <p class="panel-subtitle" style="margin-top: var(--space-1);">${step.taglineShort}</p>
        `;

        const sections = [...step.tabs, ...(step.extras || [])];
        body.innerHTML = sections
          .map(
            (s, i) => `
            <details class="disclosure" data-section-id="${s.id}" ${i === 0 ? "open" : ""}>
              <summary class="disclosure-summary">
                <span>${s.label}</span>
                <svg class="disclosure-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </summary>
              <div class="disclosure-content">
                ${renderBlocks(s.blocks)}
              </div>
            </details>`
          )
          .join("");

        // Footer reflects the currently-open section, not the whole step.
        footer.innerHTML = renderFooterCta(sections[0]?.blocks);

        // Accordion: only one open at a time. When a section opens, also
        // refresh the footer based on that section's blocks.
        const allDetails = body.querySelectorAll(".disclosure");
        allDetails.forEach((d) => {
          d.addEventListener("toggle", () => {
            if (d.open) {
              allDetails.forEach((o) => {
                if (o !== d) o.removeAttribute("open");
              });
              const sectionId = d.dataset.sectionId;
              const section = sections.find((s) => s.id === sectionId);
              footer.innerHTML = renderFooterCta(section?.blocks);
            }
          });
        });
      }

      // ============================
      // Wire tab/rail pane switching for a single variant
      // ============================
      function wireTabGroup(panel, groupSelector, btnSelector, variantKey, tabs) {
        const group = panel.querySelector(groupSelector);
        if (!group) return;
        const panes = panel.querySelectorAll("[data-pane]");
        const footer = panel.querySelector('[data-slot="footer"]');
        group.querySelectorAll(btnSelector).forEach((btn) => {
          btn.addEventListener("click", () => {
            const target = btn.dataset.paneTarget;
            group
              .querySelectorAll(btnSelector)
              .forEach((b) =>
                b.setAttribute("aria-selected", b === btn ? "true" : "false")
              );
            panes.forEach((p) =>
              p.classList.toggle("is-active", p.dataset.pane === target)
            );
            activePane[variantKey] = target;
            // Footer is per-tab: show View evidence only when the
            // newly-active tab has an evidence block in its data.
            if (footer && Array.isArray(tabs)) {
              const activeTab = tabs.find((t) => t.id === target);
              footer.innerHTML = renderFooterCta(activeTab?.blocks);
            }
          });
        });
      }

      // ============================
      // Map graphics — markers, zones, lines, circles per step.
      // Real coordinates pulled from js/data/* in the main project.
      // ============================
      let mapReady = false;
      let currentMarkers = [];
      let currentLayerIds = [];
      let currentSourceIds = [];

      function clearMapGraphics() {
        currentMarkers.forEach((m) => m.remove());
        currentMarkers = [];
        currentLayerIds.forEach((id) => {
          if (map.getLayer(id)) map.removeLayer(id);
        });
        currentSourceIds.forEach((id) => {
          if (map.getSource(id)) map.removeSource(id);
        });
        currentLayerIds = [];
        currentSourceIds = [];
      }

      // Approximate a metric-radius circle around a [lng, lat] center as a
      // polygon ring (used for the science park area overlay).
      function circleToPolygon(center, radiusM, steps) {
        const [lng, lat] = center;
        const earthRadius = 6378137;
        const coords = [];
        const cosLat = Math.cos((lat * Math.PI) / 180);
        for (let i = 0; i <= steps; i++) {
          const theta = (i * 2 * Math.PI) / steps;
          const dx = (radiusM * Math.cos(theta)) / (earthRadius * cosLat);
          const dy = (radiusM * Math.sin(theta)) / earthRadius;
          coords.push([
            lng + (dx * 180) / Math.PI,
            lat + (dy * 180) / Math.PI,
          ]);
        }
        return coords;
      }

      function applyMapGraphics(step) {
        if (!mapReady) return;
        clearMapGraphics();
        const g = step.mapGraphics;
        if (!g) return;

        (g.zones || []).forEach((z, i) => {
          const sourceId = `pg-zone-src-${i}`;
          const fillId = `pg-zone-fill-${i}`;
          const strokeId = `pg-zone-stroke-${i}`;
          map.addSource(sourceId, {
            type: "geojson",
            data: {
              type: "Feature",
              geometry: { type: "Polygon", coordinates: [z.boundary] },
            },
          });
          map.addLayer({
            id: fillId,
            type: "fill",
            source: sourceId,
            paint: { "fill-color": z.color },
          });
          map.addLayer({
            id: strokeId,
            type: "line",
            source: sourceId,
            paint: { "line-color": z.strokeColor, "line-width": 2 },
          });
          currentSourceIds.push(sourceId);
          currentLayerIds.push(fillId, strokeId);
        });

        (g.circles || []).forEach((c, i) => {
          const sourceId = `pg-circle-src-${i}`;
          const fillId = `pg-circle-fill-${i}`;
          const ring = circleToPolygon(c.center, c.radius, 64);
          map.addSource(sourceId, {
            type: "geojson",
            data: {
              type: "Feature",
              geometry: { type: "Polygon", coordinates: [ring] },
            },
          });
          map.addLayer({
            id: fillId,
            type: "fill",
            source: sourceId,
            paint: { "fill-color": c.color, "fill-opacity": 1 },
          });
          if (c.strokeColor) {
            const strokeId = `pg-circle-stroke-${i}`;
            map.addLayer({
              id: strokeId,
              type: "line",
              source: sourceId,
              paint: { "line-color": c.strokeColor, "line-width": 2 },
            });
            currentLayerIds.push(strokeId);
          }
          currentSourceIds.push(sourceId);
          currentLayerIds.push(fillId);
        });

        (g.lines || []).forEach((l, i) => {
          const sourceId = `pg-line-src-${i}`;
          const layerId = `pg-line-layer-${i}`;
          map.addSource(sourceId, {
            type: "geojson",
            data: {
              type: "Feature",
              geometry: { type: "LineString", coordinates: [l.from, l.to] },
            },
          });
          map.addLayer({
            id: layerId,
            type: "line",
            source: sourceId,
            paint: {
              "line-color": l.color || "#1e1f20",
              "line-width": l.width || 2,
              ...(l.dashed ? { "line-dasharray": [2, 2] } : {}),
            },
          });
          currentSourceIds.push(sourceId);
          currentLayerIds.push(layerId);
        });

        (g.markers || []).forEach((m) => {
          const el = document.createElement("div");
          el.className = `map-marker map-marker-${m.type}`;
          let inner = "";
          if (m.type === "logo" && m.logo) {
            inner = `<div class="map-marker-logo-inner"><img src="${m.logo}" alt="${m.label || ""}" /></div>`;
          } else if (m.type === "tier") {
            const tier = m.tier || "central";
            inner = `<div class="map-marker-pin" style="background: var(--color-tier-${tier})"></div>`;
          } else if (m.type === "property") {
            inner = `<div class="map-marker-property">${icon("home")}</div>`;
          } else if (m.type === "airport") {
            inner = `<div class="map-marker-airport">${icon("plane")}</div>`;
          }
          el.innerHTML = inner + (m.label ? `<div class="map-marker-label">${m.label}</div>` : "");
          const marker = new mapboxgl.Marker({ element: el, anchor: "center" })
            .setLngLat(m.coords)
            .addTo(map);
          currentMarkers.push(marker);
        });
      }

      // ============================
      // Render entry point
      // ============================
      function renderStep(idx) {
        const step = STEPS[idx];
        const total = STEPS.length;
        document.querySelectorAll(".variant-content").forEach((variant) => {
          const v = variant.dataset.variant;
          const panel = variant.querySelector(".panel");
          if (!panel) return;
          if (v === "a") renderVariantA(panel, step);
          else if (v === "c") renderVariantC(panel, step);

          // Reset the panel to its open state on step change.
          panel.classList.remove("is-closed");
          variant.classList.remove("panel-closed");
        });

        // Disabled-state per cluster.
        document.querySelectorAll("[data-nav]").forEach((cluster) => {
          const prev = cluster.querySelector("[data-nav-prev]");
          const next = cluster.querySelector("[data-nav-next]");
          if (prev) prev.toggleAttribute("disabled", idx === 0);
          if (next) next.toggleAttribute("disabled", idx === total - 1);
        });

        // Single step indicator outside the iPad frame.
        const stepCount = document.querySelector("[data-step-count]");
        const stepTitle = document.querySelector("[data-step-title]");
        if (stepCount) stepCount.textContent = `Step ${idx + 1} of ${total}`;
        if (stepTitle) stepTitle.textContent = step.title;

        // Fly the map using the step's real camera (ipad-tuned).
        map.flyTo({
          center: step.camera.center,
          zoom: step.camera.zoom,
          pitch: step.camera.pitch,
          bearing: step.camera.bearing,
          duration: step.camera.duration || 1800,
        });

        // Swap the map graphics (markers, zones, lines).
        applyMapGraphics(step);
      }

      // ============================
      // Variant switcher (top chips)
      // ============================
      const chips = document.querySelectorAll(".chip");
      const variants = document.querySelectorAll(".variant-content");

      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          const target = chip.dataset.variant;
          chips.forEach((c) =>
            c.setAttribute("aria-pressed", c === chip ? "true" : "false")
          );
          variants.forEach((v) =>
            v.classList.toggle("is-active", v.dataset.variant === target)
          );
        });
      });

      // ============================
      // Nav arrows — cycle through steps
      // ============================
      document.querySelectorAll("[data-nav]").forEach((cluster) => {
        const prev = cluster.querySelector("[data-nav-prev]");
        const next = cluster.querySelector("[data-nav-next]");
        prev?.addEventListener("click", () => {
          if (activeIdx === 0) return;
          activeIdx = activeIdx - 1;
          renderStep(activeIdx);
        });
        next?.addEventListener("click", () => {
          if (activeIdx === STEPS.length - 1) return;
          activeIdx = activeIdx + 1;
          renderStep(activeIdx);
        });
      });

      // ============================
      // Close / reopen the panel within each variant
      // ============================
      document.querySelectorAll(".variant-content").forEach((variant) => {
        const closeBtn = variant.querySelector(".panel-close");
        const reopenBtn = variant.querySelector(".reopen-btn");
        const panel = variant.querySelector(".panel");
        if (!closeBtn || !reopenBtn || !panel) return;
        closeBtn.addEventListener("click", () => {
          panel.classList.add("is-closed");
          variant.classList.add("panel-closed");
        });
        reopenBtn.addEventListener("click", () => {
          panel.classList.remove("is-closed");
          variant.classList.remove("panel-closed");
        });
      });

      // Initial render — runs immediately for the panel, but map graphics
      // can only be applied once Mapbox finishes loading its style.
      renderStep(activeIdx);

      map.on("load", () => {
        mapReady = true;
        applyMapGraphics(STEPS[activeIdx]);
      });
    </script>
  </body>
</html>
